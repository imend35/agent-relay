services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_relay}
      POSTGRES_USER: ${POSTGRES_USER:-relay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relay_local_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  agent-relay:
    build:
      context: .
    image: agent-relay:local
    environment:
      RELAY_DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER:-relay}:${POSTGRES_PASSWORD:-relay_local_password}@postgres:5432/${POSTGRES_DB:-agent_relay}
      RELAY_RECOVERY_INTERVAL_SECONDS: ${RELAY_RECOVERY_INTERVAL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${RELAY_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
