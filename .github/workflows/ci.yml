name: Agent Relay CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  TEST_DATABASE_URL: postgresql+psycopg://relay:relay_local_password@127.0.0.1:5432/agent_relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_relay
          POSTGRES_USER: relay
          POSTGRES_PASSWORD: relay_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and project dependencies
        run: python -m pip install --upgrade uv && uv sync --frozen

      - name: Run starter tests against PostgreSQL
        run: uv run pytest -q test_agent_relay.py
        env:
          RELAY_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Start API for live integration test
        env:
          RELAY_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          nohup uv run uvicorn main:app --host 0.0.0.0 --port 8000 > /tmp/agent-relay.log 2>&1 &
          echo $! > /tmp/agent-relay.pid
          for attempt in $(seq 1 60); do
            if python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/agent-relay.log
          exit 1

      - name: Run live API and database integration test
        run: uv run pytest -q integration_test.py
        env:
          RELAY_BASE_URL: http://127.0.0.1:8000

  build-and-deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install kind and kubectl
        shell: bash
        run: |
          set -euo pipefail
          install_tool() {
            local source_path="$1"
            local target_path="$2"
            if [ "$(id -u)" -eq 0 ]; then
              install -m 0755 "$source_path" "$target_path"
            else
              sudo install -m 0755 "$source_path" "$target_path"
            fi
          }
          curl -fsSL -o "$RUNNER_TEMP/kind" https://kind.sigs.k8s.io/dl/latest/kind-linux-amd64
          install_tool "$RUNNER_TEMP/kind" /usr/local/bin/kind
          kubectl_version="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL -o "$RUNNER_TEMP/kubectl" "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          install_tool "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
          kind version
          kubectl version --client

      - name: Create kind cluster
        run: kind create cluster --name agent-relay --wait 90s

      - name: Build and load a unique image
        shell: bash
        run: |
          set -euo pipefail
          image_tag="agent-relay:${GITHUB_SHA:-local-${GITHUB_RUN_ID:-$(date +%s)}}"
          echo "IMAGE_TAG=${image_tag}" >> "$GITHUB_ENV"
          docker build --tag "$image_tag" .
          kind load docker-image "$image_tag" --name agent-relay

      - name: Deploy PostgreSQL and Agent Relay
        shell: bash
        run: |
          set -euo pipefail
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status deployment/postgres --timeout=180s
          kubectl kustomize k8s \
            | sed "s#image: agent-relay:local#image: ${IMAGE_TAG}#g" \
            | kubectl apply -f -
          kubectl rollout status deployment/agent-relay --timeout=180s
          kubectl get pods -o wide

      - name: Smoke test the deployed service
        shell: bash
        run: |
          set -euo pipefail
          kubectl port-forward service/agent-relay 18000:8000 > /tmp/agent-relay-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/ready >/tmp/agent-relay-ready.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/agent-relay-ready.json
          curl -fsS http://127.0.0.1:18000/health
          expected_heading="$(sed -n 's/.*<h1>\([^<]*\)<\/h1>.*/\1/p' dashboard.html | head -n 1)"
          test -n "$expected_heading"
          curl -fsS http://127.0.0.1:18000/ | grep -F "<h1>${expected_heading}</h1>"
